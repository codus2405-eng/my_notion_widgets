<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Soft YouTube Music Player</title>
<style>
:root{
  --bg:#F7F8F3;
  --sage:#A9C4AE;
  --sage-dark:#718D78;
  --line:#E3E9E3;
  --text:#4F5C53;
  --muted:#9AA69D;
}
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  display:grid;
  place-items:center;
  padding:16px;
  background:transparent;
  font-family:Arial,"Noto Sans KR",sans-serif;
  color:var(--text);
}
.player{
  width:min(100%,380px);
  background:var(--bg);
  border:1px solid var(--line);
  border-radius:24px;
  padding:14px;
  box-shadow:0 8px 24px rgba(80,100,88,.08);
}
.cover{
  position:relative;
  width:100%;
  aspect-ratio:1/1;
  overflow:hidden;
  border-radius:18px;
  background:#EAF0EA;
}
#thumb{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}
#yt{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  border:0;
  display:none;
}
.cover.playing #thumb{display:none}
.cover.playing #yt{display:block}

.cover-btn{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  width:64px;
  height:64px;
  border:0;
  border-radius:50%;
  background:rgba(255,255,255,.96);
  color:var(--sage-dark);
  font-size:23px;
  cursor:pointer;
  box-shadow:0 5px 18px rgba(50,70,58,.14);
}
.cover.playing .cover-btn{display:none}

.info{padding:14px 3px 6px}
.title{font-size:15px;font-weight:700;margin-bottom:4px}
.status{font-size:12px;color:var(--muted)}

.progress{margin:5px 2px 3px}
.progress input{
  width:100%;
  accent-color:var(--sage-dark);
  cursor:pointer;
}
.times{
  display:flex;
  justify-content:space-between;
  font-size:10px;
  color:var(--muted);
}
.controls{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:14px;
  padding:7px 0 10px;
}
.ctrl{
  width:38px;
  height:38px;
  border:0;
  border-radius:50%;
  background:transparent;
  color:var(--text);
  font-size:17px;
  cursor:pointer;
}
.ctrl:hover{background:#EDF2ED}
.play{
  width:52px;
  height:52px;
  background:var(--sage);
  color:#fff;
  font-size:20px;
  box-shadow:0 5px 12px rgba(90,120,98,.18);
}
.play:hover{background:var(--sage-dark)}

.row{display:flex;gap:7px}
.url{
  flex:1;
  min-width:0;
  height:36px;
  border:1px solid var(--line);
  border-radius:11px;
  padding:0 11px;
  outline:0;
  background:#fff;
  color:var(--text);
  font-size:11px;
}
.url:focus{border-color:var(--sage)}
.load{
  height:36px;
  padding:0 12px;
  border:0;
  border-radius:11px;
  background:#E5EEE6;
  color:var(--sage-dark);
  font-size:11px;
  font-weight:700;
  cursor:pointer;
}
.load:hover{background:#DCE8DE}
.note{
  text-align:center;
  margin-top:8px;
  font-size:9px;
  color:#A7B0A9;
}
</style>
</head>

<body>
<div class="player">

  <div class="cover" id="cover">
    <img id="thumb" alt="YouTube thumbnail">
    <iframe id="yt"
      title="YouTube Music Player"
      allow="autoplay; encrypted-media; picture-in-picture"
      allowfullscreen>
    </iframe>
    <button class="cover-btn" id="coverPlay" aria-label="재생">▶</button>
  </div>

  <div class="info">
    <div class="title" id="title">YouTube Music</div>
    <div class="status" id="status">유튜브 링크를 입력해주세요</div>
  </div>

  <div class="progress">
    <input id="bar" type="range" min="0" max="100" value="0">
    <div class="times">
      <span id="cur">0:00</span>
      <span id="dur">0:00</span>
    </div>
  </div>

  <div class="controls">
    <button class="ctrl" id="back" title="10초 뒤로">↶</button>
    <button class="ctrl play" id="toggle" title="재생/일시정지">▶</button>
    <button class="ctrl" id="forward" title="10초 앞으로">↷</button>
  </div>

  <div class="row">
    <input class="url" id="url" placeholder="YouTube 링크 붙여넣기">
    <button class="load" id="load">불러오기</button>
  </div>

  <div class="note">YouTube 공식 임베드 사용 · 무료 호스팅 가능</div>
</div>

<script>
let videoId = "";
let playing = false;
let duration = 0;
let current = 0;
let timer = null;

const $ = id => document.getElementById(id);
const iframe = $("yt");
const cover = $("cover");

function extractId(value){
  if(!value) return null;
  value = value.trim();

  try{
    const url = new URL(value);

    // youtu.be/VIDEO_ID
    if(url.hostname.includes("youtu.be")){
      return url.pathname.split("/").filter(Boolean)[0] || null;
    }

    // youtube.com/watch?v=VIDEO_ID
    const v = url.searchParams.get("v");
    if(v) return v;

    // youtube.com/embed/VIDEO_ID
    // youtube.com/shorts/VIDEO_ID
    const parts = url.pathname.split("/").filter(Boolean);
    const index = parts.findIndex(x => x === "embed" || x === "shorts");
    if(index !== -1 && parts[index+1]) return parts[index+1];

  }catch(e){}

  // 혹시 URL이 아닌 VIDEO_ID만 입력한 경우
  const match = value.match(/[A-Za-z0-9_-]{11}/);
  return match ? match[0] : null;
}

function formatTime(seconds){
  seconds = Math.floor(Number(seconds) || 0);
  return Math.floor(seconds/60) + ":" + String(seconds%60).padStart(2,"0");
}

function send(command, args=[]){
  if(!iframe.src) return;

  iframe.contentWindow.postMessage(JSON.stringify({
    event:"command",
    func:command,
    args:args
  }), "https://www.youtube.com");
}

function loadVideo(id){
  if(!id){
    $("status").textContent = "올바른 YouTube 링크를 입력해주세요";
    return;
  }

  videoId = id;
  playing = false;
  duration = 0;
  current = 0;

  // 썸네일
  $("thumb").src = "https://img.youtube.com/vi/" + id + "/hqdefault.jpg";

  $("status").textContent = "재생 버튼을 눌러주세요";
  $("toggle").textContent = "▶";
  $("bar").value = 0;
  $("cur").textContent = "0:00";
  $("dur").textContent = "0:00";
  cover.classList.remove("playing");

  // YouTube 공식 임베드
  iframe.src =
    "https://www.youtube.com/embed/" + encodeURIComponent(id) +
    "?enablejsapi=1&controls=0&rel=0&playsinline=1";

  // 썸네일 로딩 실패 시에도 위젯이 깨져 보이지 않도록 처리
  $("thumb").onerror = function(){
    this.style.display = "none";
  };
}

function play(){
  if(!videoId) return;
  cover.classList.add("playing");
  send("playVideo");
  playing = true;
  $("toggle").textContent = "Ⅱ";
  $("status").textContent = "재생 중";
  startTimer();
}

function pause(){
  send("pauseVideo");
  playing = false;
  $("toggle").textContent = "▶";
  $("status").textContent = "일시정지";
  stopTimer();
}

function toggle(){
  if(playing) pause();
  else play();
}

function seek(seconds){
  if(!videoId) return;
  send("seekTo",[Math.max(0,current + seconds),true]);
}

function startTimer(){
  stopTimer();

  // 영상 정보를 가져오기 위한 API 명령
  send("getDuration");

  timer = setInterval(()=>{
    send("getCurrentTime");
    send("getDuration");

    // 실제 표시값은 iframe API 이벤트 응답 대신
    // 플레이어의 진행률을 부드럽게 갱신
    if(duration > 0 && playing){
      current += 0.5;
      if(current > duration) current = duration;

      $("bar").value = current / duration * 100;
      $("cur").textContent = formatTime(current);
      $("dur").textContent = formatTime(duration);
    }
  },500);
}

function stopTimer(){
  if(timer) clearInterval(timer);
  timer = null;
}

// YouTube postMessage 응답 수신
window.addEventListener("message", event=>{
  if(!event.origin.includes("youtube.com")) return;

  let data;
  try{
    data = typeof event.data === "string" ? JSON.parse(event.data) : event.data;
  }catch(e){ return; }

  if(data && data.info){
    if(typeof data.info.duration === "number"){
      duration = data.info.duration;
      $("dur").textContent = formatTime(duration);
    }
    if(typeof data.info.currentTime === "number"){
      current = data.info.currentTime;
      $("cur").textContent = formatTime(current);
      if(duration > 0) $("bar").value = current/duration*100;
    }
  }
});

$("coverPlay").onclick = play;
$("toggle").onclick = toggle;
$("back").onclick = ()=>seek(-10);
$("forward").onclick = ()=>seek(10);

$("load").onclick = ()=>{
  const id = extractId($("url").value);
  loadVideo(id);
};

$("url").addEventListener("keydown", e=>{
  if(e.key === "Enter"){
    const id = extractId($("url").value);
    loadVideo(id);
  }
});

$("bar").addEventListener("input", ()=>{
  if(!duration) return;
  current = Number($("bar").value) / 100 * duration;
  $("cur").textContent = formatTime(current);
  send("seekTo",[current,true]);
});

// 테스트용 영상은 넣지 않고 빈 상태로 시작
</script>
</body>
</html>
