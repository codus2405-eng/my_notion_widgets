<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weekly Plan</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Malgun Gothic", sans-serif;
    background: transparent;
    padding: 20px 12px;
  }
  .card {
    max-width: 900px;
    margin: 0 auto;
    background: #FFFFFF;
    border: 1.5px solid #2B2B28;
    border-radius: 4px;
    padding: 22px 24px 26px;
  }
  .top-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 18px;
  }
  .title {
    font-size: 20px;
    font-weight: 700;
    color: #2B2B28;
    letter-spacing: 0.5px;
  }
  .week-nav {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .week-nav button {
    width: 24px; height: 24px;
    border: 1px solid #D8DDD9;
    background: #FFFFFF;
    border-radius: 50%;
    cursor: pointer;
    font-size: 13px;
    color: #6FA35E;
    display: flex; align-items: center; justify-content: center;
  }
  .week-nav button:active { background: #EAF1EA; }
  .week-label {
    font-size: 13px;
    font-weight: 600;
    color: #3C3C38;
    min-width: 80px;
    text-align: center;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    border-top: 1px solid #E4E4E0;
    border-left: 1px solid #E4E4E0;
  }
  .cell {
    border-right: 1px solid #E4E4E0;
    border-bottom: 1px solid #E4E4E0;
    min-height: 220px;
    padding: 10px 12px 12px;
    display: flex;
    flex-direction: column;
  }

  /* 요약 셀 */
  .summary-cell {
    background: #FAFAF8;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .summary-title-row { display: flex; align-items: center; justify-content: center; gap: 6px; margin-bottom: 10px; }
  .summary-title { font-size: 12px; font-weight: 700; color: #6B7A54; }
  .summary-percent { font-size: 14px; font-weight: 700; color: #4A5D3A; }
  .progress-bar-wrap {
    background: #E9ECE6; border-radius: 6px; height: 8px; overflow: hidden; margin-bottom: 18px;
  }
  .progress-bar { height: 100%; background: #6FA35E; width: 0%; transition: width 0.3s; }
  .day-summary-list { list-style: none; margin-bottom: 16px; }
  .day-summary-list li { display: flex; align-items: center; gap: 8px; padding: 4px 0; }
  .day-summary-list .day-label { font-size: 11px; color: #8A8A82; width: 14px; flex-shrink: 0; }
  .mini-bar-wrap { flex: 1; background: #E9ECE6; border-radius: 4px; height: 5px; overflow: hidden; }
  .mini-bar { height: 100%; background: #6FA35E; width: 0%; transition: width 0.3s; }
  .mini-bar.empty { background: #E9ECE6; }

  .carryover-title {
    font-size: 10px; font-weight: 700; color: #6B7A54;
    display: flex; align-items: center; justify-content: center; gap: 4px;
    line-height: 1; margin-bottom: 8px;
  }
  .carryover-title .leaf { font-size: 11px; line-height: 1; display: inline-flex; align-items: center; }
  .carryover-list { list-style: none; }
  .carryover-list li { display: flex; align-items: flex-start; gap: 5px; padding: 3px 0; flex-wrap: wrap; }
  .carryover-list .box {
    width: 9px; height: 9px; border: 1.2px solid #6FA35E; border-radius: 2px;
    flex-shrink: 0; margin-top: 2px; cursor: pointer;
  }
  .carryover-list .week-tag {
    font-size: 10px; font-weight: 700; color: #3B5C2B;
    cursor: pointer; white-space: nowrap;
  }
  .carryover-list .txt { font-size: 10px; color: #6FA35E; cursor: pointer; word-break: break-word; }

  /* 요일 셀 */
  .day-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
  .day-name { font-size: 12px; font-weight: 700; letter-spacing: 1px; color: #8A8A82; }
  .day-name.sat { color: #6E9BCF; }
  .day-name.sun { color: #E28D7D; }
  .day-date { font-size: 11px; color: #B9B9B0; }

  .todo-list { flex: 1; list-style: none; margin-bottom: 6px; }
  .todo-list li {
    display: flex; align-items: flex-start; gap: 6px;
    font-size: 12.5px; color: #3C3C38; padding: 4px 0;
    border-bottom: 1px dotted #EDEDE8;
  }
  .todo-list li .box {
    width: 13px; height: 13px; border: 1.5px solid #B9C7AE; border-radius: 3px;
    flex-shrink: 0; margin-top: 1px; cursor: pointer; display:flex; align-items:center; justify-content:center;
  }
  .todo-list li.done .box { background: #6FA35E; border-color: #6FA35E; }
  .todo-list li.done .box::after { content: "✓"; color: #fff; font-size: 9px; }
  .todo-list li.done .txt { text-decoration: line-through; color: #C2C2BA; }
  .todo-list li .txt { flex: 1; word-break: break-word; cursor: pointer; }
  .todo-list li .del { color: #D8D8D2; font-size: 12px; cursor: pointer; padding: 0 2px; }

  .add-row input {
    width: 100%; border: none; border-top: 1px dashed #E4E4E0;
    font-size: 12px; padding: 6px 0 0; color: #3C3C38; outline: none; font-family: inherit;
  }
  .add-row input::placeholder { color: #C2C2BA; }
</style>
</head>
<body>

<div class="card">
  <div class="top-row">
    <div class="title">Weekly Plan</div>
    <div class="week-nav">
      <button id="prevWeek">&#8249;</button>
      <div class="week-label" id="weekLabel"></div>
      <button id="nextWeek">&#8250;</button>
    </div>
  </div>
  <div class="grid" id="grid"></div>
</div>

<script>
  const dayNames = ['MON','TUE','WED','THU','FRI','SAT','SUN'];
  const dayShort = ['월','화','수','목','금','토','일'];

  function getMonday(d) {
    const date = new Date(d);
    const day = date.getDay();
    const diff = day === 0 ? -6 : 1 - day;
    date.setDate(date.getDate() + diff);
    date.setHours(0,0,0,0);
    return date;
  }

  let weekStart = getMonday(new Date());

  function dateKey(d) {
    return `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`;
  }
  function storageKey(d) {
    return 'weekly_todo_' + dateKey(d);
  }
  function loadTasks(d) {
    try { return JSON.parse(localStorage.getItem(storageKey(d))) || []; }
    catch(e) { return []; }
  }
  function saveTasks(d, tasks) {
    localStorage.setItem(storageKey(d), JSON.stringify(tasks));
  }

  function weekLabelText(monday) {
    const month = monday.getMonth() + 1;
    const weekNum = Math.ceil(monday.getDate() / 7);
    return `${month}월 ${weekNum}주차`;
  }

  function getWeekDates(monday) {
    const arr = [];
    for (let i = 0; i < 7; i++) {
      const d = new Date(monday);
      d.setDate(monday.getDate() + i);
      arr.push(d);
    }
    return arr;
  }

  function render() {
    document.getElementById('weekLabel').textContent = weekLabelText(weekStart);
    const grid = document.getElementById('grid');
    grid.innerHTML = '';

    const weekDates = getWeekDates(weekStart);

    // 요약 셀
    const summaryCell = document.createElement('div');
    summaryCell.className = 'cell summary-cell';
    summaryCell.innerHTML = `
      <div class="summary-title-row">
        <span class="summary-title">이번 주 달성률</span>
        <span class="summary-percent" id="progressPercent">0%</span>
      </div>
      <div class="progress-bar-wrap"><div class="progress-bar" id="progressBar"></div></div>
      <ul class="day-summary-list" id="daySummaryList"></ul>
      <div class="carryover-section" id="carryoverSection" style="display:none;">
        <div class="carryover-title"><span class="leaf">☘️</span>미달성</div>
        <ul class="carryover-list" id="carryoverList"></ul>
      </div>
    `;
    grid.appendChild(summaryCell);

    // 월,화,수 (1행)
    [0,1,2].forEach(i => grid.appendChild(buildDayCell(weekDates[i], i)));
    // 목,금,토,일 (2행)
    [3,4,5,6].forEach(i => grid.appendChild(buildDayCell(weekDates[i], i)));

    updateSummary(weekDates);
  }

  function buildDayCell(date, idx) {
    const cell = document.createElement('div');
    cell.className = 'cell day-cell';
    const nameClass = idx === 5 ? 'sat' : (idx === 6 ? 'sun' : '');
    cell.innerHTML = `
      <div class="day-header">
        <span class="day-name ${nameClass}">${dayNames[idx]}</span>
        <span class="day-date">${date.getMonth()+1}/${date.getDate()}</span>
      </div>
      <ul class="todo-list"></ul>
      <div class="add-row"><input type="text" placeholder="+ 할 일 추가"></div>
    `;
    const list = cell.querySelector('.todo-list');
    const input = cell.querySelector('input');

    function renderList() {
      const tasks = loadTasks(date);
      list.innerHTML = '';
      tasks.forEach((t, i) => {
        const li = document.createElement('li');
        if (t.done) li.classList.add('done');
        li.innerHTML = `<span class="box"></span><span class="txt">${t.text}</span><span class="del">×</span>`;
        li.querySelector('.box').addEventListener('click', () => {
          tasks[i].done = !tasks[i].done;
          saveTasks(date, tasks);
          renderList();
          updateSummary(getWeekDates(weekStart));
        });
        li.querySelector('.txt').addEventListener('click', () => {
          tasks[i].done = !tasks[i].done;
          saveTasks(date, tasks);
          renderList();
          updateSummary(getWeekDates(weekStart));
        });
        li.querySelector('.del').addEventListener('click', () => {
          tasks.splice(i, 1);
          saveTasks(date, tasks);
          renderList();
          updateSummary(getWeekDates(weekStart));
        });
        list.appendChild(li);
      });
    }
    renderList();

    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && input.value.trim()) {
        const tasks = loadTasks(date);
        tasks.push({ text: input.value.trim(), done: false });
        saveTasks(date, tasks);
        input.value = '';
        renderList();
        updateSummary(getWeekDates(weekStart));
      }
    });

    return cell;
  }

  function updateSummary(weekDates) {
    let total = 0, done = 0;
    const perDay = [];
    weekDates.forEach((d) => {
      const tasks = loadTasks(d);
      const dayTotal = tasks.length;
      const dayDone = tasks.filter(t => t.done).length;
      total += dayTotal;
      done += dayDone;
      perDay.push({ total: dayTotal, done: dayDone });
    });
    const percent = total === 0 ? 0 : Math.round((done / total) * 100);
    document.getElementById('progressBar').style.width = percent + '%';
    document.getElementById('progressPercent').textContent = percent + '%';

    const listEl = document.getElementById('daySummaryList');
    listEl.innerHTML = '';
    dayShort.forEach((label, i) => {
      const dayPercent = perDay[i].total === 0 ? 0 : Math.round((perDay[i].done / perDay[i].total) * 100);
      const li = document.createElement('li');
      li.innerHTML = `
        <span class="day-label">${label}</span>
        <div class="mini-bar-wrap"><div class="mini-bar ${perDay[i].total === 0 ? 'empty' : ''}" style="width:${dayPercent}%"></div></div>
      `;
      listEl.appendChild(li);
    });

    renderCarryover();
  }

  function getAllOverdueTasks() {
    const overdue = [];
    for (let i = 0; i < localStorage.length; i++) {
      const key = localStorage.key(i);
      if (key && key.startsWith('weekly_todo_')) {
        const parts = key.replace('weekly_todo_', '').split('-');
        const d = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
        if (d < weekStart) {
          const tasks = JSON.parse(localStorage.getItem(key) || '[]');
          tasks.forEach((t, idx) => {
            if (!t.done) overdue.push({ key, idx, text: t.text, date: d });
          });
        }
      }
    }
    return overdue;
  }

  function renderCarryover() {
    const section = document.getElementById('carryoverSection');
    const listEl = document.getElementById('carryoverList');
    const overdue = getAllOverdueTasks();

    if (overdue.length === 0) {
      section.style.display = 'none';
      return;
    }
    section.style.display = 'block';
    listEl.innerHTML = '';
    overdue.forEach(item => {
      const li = document.createElement('li');
      const tagText = weekLabelText(getMonday(item.date));
      li.innerHTML = `<span class="box"></span><span class="week-tag">${tagText}</span><span class="txt">${item.text}</span>`;
      li.querySelector('.box').addEventListener('click', () => {
        const tasks = JSON.parse(localStorage.getItem(item.key) || '[]');
        if (tasks[item.idx]) {
          tasks[item.idx].done = true;
          localStorage.setItem(item.key, JSON.stringify(tasks));
        }
        renderCarryover();
      });
      li.querySelector('.week-tag').addEventListener('click', () => {
        weekStart = getMonday(item.date);
        render();
      });
      listEl.appendChild(li);
    });
  }

  document.getElementById('prevWeek').addEventListener('click', () => {
    weekStart.setDate(weekStart.getDate() - 7);
    weekStart = new Date(weekStart);
    render();
  });
  document.getElementById('nextWeek').addEventListener('click', () => {
    weekStart.setDate(weekStart.getDate() + 7);
    weekStart = new Date(weekStart);
    render();
  });

  render();
</script>
</body>
</html>
