<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Notion Todo</title><style>*{box-sizing:border-box}body{margin:0;background:transparent;color:#4f514f;font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.widget{width:min(100%,520px);padding:22px;border:1px solid #e7e9e5;border-radius:22px;background:rgba(255,255,255,.94);box-shadow:0 8px 28px rgba(54,67,55,.08)}.eyebrow{font-size:12px;letter-spacing:.12em;color:#9aa59a;margin-bottom:7px}h1{font-size:22px;margin:0 0 16px;font-weight:650;letter-spacing:-.03em}.row{display:flex;gap:9px}input{flex:1;min-width:0;height:46px;padding:0 14px;border:1px solid #dfe4df;border-radius:13px;outline:none;font-size:14px;color:#424642;background:#fbfcfa}input:focus{border-color:#aebcae;box-shadow:0 0 0 3px rgba(174,188,174,.16)}button{height:46px;padding:0 17px;border:0;border-radius:13px;background:#6f8a70;color:white;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap}button:disabled{opacity:.55;cursor:wait}.hint{font-size:11px;color:#a1a7a1;margin-top:10px}.message{min-height:18px;margin-top:10px;font-size:12px}.ok{color:#66816a}.err{color:#b56b68}</style></head><body><div class="widget"><div class="eyebrow">WEEKLY AGENDA · TODO</div><h1>오늘 할 일을 추가해요 ✦</h1><div class="row"><input id="todo" maxlength="200" placeholder="예: 상세페이지 수정하기" autocomplete="off"><button id="add">＋ 추가</button></div><div class="hint">추가하면 연결된 Notion 「할일」 데이터베이스에 바로 생성됩니다.</div><div id="message" class="message"></div></div><script>const input=document.getElementById('todo'),button=document.getElementById('add'),message=document.getElementById('message');async function addTodo(){const title=input.value.trim();if(!title){message.className='message err';message.textContent='할 일을 먼저 입력해 주세요.';input.focus();return}button.disabled=true;message.className='message';message.textContent='추가하는 중…';try{const res=await fetch('/api/todo',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title})});const data=await res.json().catch(()=>({}));if(!res.ok)throw new Error(data.message||'추가하지 못했어요.');input.value='';message.className='message ok';message.textContent='✓ Notion에 할 일이 추가됐어요.'}catch(err){message.className='message err';message.textContent='오류: '+err.message}finally{button.disabled=false;input.focus()}}button.addEventListener('click',addTodo);input.addEventListener('keydown',e=>{if(e.key==='Enter')addTodo()});</script></body></html>
