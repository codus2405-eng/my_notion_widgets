<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Playlist Music Player</title>
<style>
:root{
  --paper:#F7F8F3;
  --white:#FFFFFF;
  --sage:#A8C2AD;
  --sage-light:#E4EDE5;
  --sage-dark:#718A78;
  --text:#505B54;
  --sub:#9BA59E;
  --line:#E2E8E2;
}
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  display:grid;
  place-items:center;
  padding:14px;
  background:transparent;
  font-family:"Noto Sans KR",Arial,sans-serif;
  color:var(--text);
}
.player{
  width:min(100%,360px);
  padding:13px;
  border:1px solid var(--line);
  border-radius:26px;
  background:rgba(247,248,243,.97);
  box-shadow:0 10px 30px rgba(82,96,87,.08);
}
.cover{
  position:relative;
  width:100%;
  aspect-ratio:1;
  overflow:hidden;
  border-radius:20px;
  background:#EAF0EA;
}
#yt{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  border:0;
}
#yt iframe{
  position:absolute;
  left:0;
  top:-38.9%;
  width:100%;
  height:177.8%;
  border:0;
}
.thumb-layer{
  position:absolute;
  inset:0;
  z-index:3;
  background:#EAF0EA;
}
#thumb{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}
.cover.playing .thumb-layer{display:none}

.cover-play{
  position:absolute;
  z-index:4;
  left:50%;
  top:50%;
  width:58px;
  height:58px;
  transform:translate(-50%,-50%);
  border:1px solid rgba(255,255,255,.8);
  border-radius:50%;
  background:rgba(255,255,255,.95);
  color:var(--sage-dark);
  display:grid;
  place-items:center;
  cursor:pointer;
  box-shadow:0 7px 20px rgba(70,90,77,.16);
}
.cover-play svg{width:23px;height:23px;fill:currentColor}
.cover.playing .cover-play{display:none}

.content{
  padding:14px 3px 0;
  display:flex;
  flex-direction:column;
}
.song-name{
  height:22px;
  display:flex;
  align-items:center;
  margin:0;
  font-size:15px;
  font-weight:700;
  letter-spacing:-.3px;
  line-height:22px;
}
.music-icon{color:var(--sage-dark)}
.controls{
  width:100%;
  height:46px;
  margin:8px 0 10px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:27px;
}
.ctrl{
  width:40px;
  height:40px;
  flex:0 0 40px;
  border:0;
  background:transparent;
  color:var(--sage-dark);
  cursor:pointer;
  display:grid;
  place-items:center;
  padding:0;
}
.ctrl svg{width:31px;height:31px;fill:currentColor}
.main-play{width:44px;height:44px}
.main-play svg{width:33px;height:33px}

.add-button{
  width:100%;
  height:42px;
  margin:0;
  border:0;
  border-radius:15px;
  background:var(--sage-light);
  color:var(--sage-dark);
  font-size:12px;
  font-weight:600;
  cursor:pointer;
}
.add-button:hover{background:#DCE8DE}

.playlist{
  display:none;
  margin-top:10px;
  padding:10px;
  border:1px solid var(--line);
  border-radius:17px;
  background:#FCFDF9;
}
.playlist.open{display:block}
.playlist-title{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:8px;
  font-size:12px;
  font-weight:700;
}
.count{font-size:10px;color:var(--sub);font-weight:400}
.add-row{display:flex;gap:6px}
.url-input{
  flex:1;
  min-width:0;
  height:52px;
  border:1px solid var(--line);
  border-radius:10px;
  padding:8px 10px;
  outline:none;
  background:white;
  color:var(--text);
  font:10px/1.4 "Noto Sans KR",Arial,sans-serif;
  resize:none;
}
.url-input:focus{border-color:var(--sage)}
.add{
  flex:none;
  height:34px;
  padding:0 11px;
  border:0;
  border-radius:10px;
  background:var(--sage);
  color:white;
  font-size:10px;
  font-weight:700;
  cursor:pointer;
}
.help{
  margin:6px 1px 8px;
  font-size:8px;
  color:#A7B0A8;
}
.list{
  display:flex;
  flex-direction:column;
  gap:5px;
  max-height:180px;
  overflow:auto;
}
.item{
  display:flex;
  align-items:center;
  gap:7px;
  min-height:48px;
  padding:5px 6px;
  border-radius:11px;
  background:#F5F8F3;
  cursor:pointer;
}
.item.active{background:#E8F0E8}
.num{width:16px;flex:none;text-align:center;font-size:10px;color:var(--sub)}
.item.active .num{color:var(--sage-dark);font-weight:700}
.item img{width:42px;height:34px;flex:none;object-fit:cover;border-radius:7px;background:#E9EEE9}
.item-info{min-width:0;flex:1}
.item-title{font-size:9px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item-sub{margin-top:2px;font-size:8px;color:var(--sub)}
.delete{width:22px;height:22px;border:0;background:transparent;color:#A7B0A8;font-size:14px;cursor:pointer}
.delete:hover{color:var(--sage-dark)}
.empty{padding:10px 4px 6px;text-align:center;font-size:9px;color:#A7B0A8}
</style>
</head>
<body>
<div class="player">
  <div class="cover" id="cover">
    <div id="yt"></div>
    <div class="thumb-layer" id="thumbLayer">
      <img id="thumb" alt="">
      <button class="cover-play" id="coverPlay" aria-label="재생">
        <svg viewBox="0 0 24 24"><path d="M8 5.2v13.6c0 .7.8 1.1 1.4.7l10.1-6.8c.6-.4.6-1.3 0-1.7L9.4 4.5C8.8 4.1 8 4.5 8 5.2z"/></svg>
      </button>
    </div>
  </div>

  <div class="content">
    <div class="song-name" id="songName">Playlist <span class="music-icon">🎵</span></div>

    <div class="controls">
      <button class="ctrl" id="back" aria-label="이전 음악">
        <svg viewBox="0 0 40 32"><path d="M3 16L17 6v20L3 16zM18 16L32 6v20L18 16z"/></svg>
      </button>
      <button class="ctrl main-play" id="toggle" aria-label="재생/일시정지">
        <svg id="playIcon" viewBox="0 0 40 40"><path d="M12 7v26l21-13z"/></svg>
      </button>
      <button class="ctrl" id="forward" aria-label="다음 음악">
        <svg viewBox="0 0 40 32"><path d="M37 16L23 6v20L37 16zM22 16L8 6v20L22 16z"/></svg>
      </button>
    </div>

    <button type="button" class="add-button" id="showPlaylist">+ Add music list</button>

    <div class="playlist" id="playlist">
      <div class="playlist-title">
        <span>Play List</span>
        <span class="count" id="count">0 / 20</span>
      </div>
      <div class="add-row">
        <textarea class="url-input" id="url" placeholder="YouTube 링크를 붙여넣어주세요&#10;여러 개는 줄바꿈으로 입력"></textarea>
        <button type="button" class="add" id="add">추가</button>
      </div>
      <div class="help">여러 링크를 줄바꿈해서 한 번에 추가할 수 있어요 · 최대 20곡</div>
      <div class="list" id="list"><div class="empty">아직 추가된 음악이 없어요.</div></div>
    </div>
  </div>
</div>

<script src="https://www.youtube.com/iframe_api"></script>
<script>
let player=null;
let apiReady=false;
let playerReady=false;
let pendingVideo=null;
let pendingAutoplay=false;
let playlist=[];
let currentIndex=-1;
let playing=false;

const $=id=>document.getElementById(id);

function extractId(value){
  if(!value)return null;
  value=value.trim();
  try{
    const u=new URL(value);
    if(u.hostname.includes("youtu.be"))
      return u.pathname.split("/").filter(Boolean)[0]||null;
    const v=u.searchParams.get("v");
    if(v)return v;
    const parts=u.pathname.split("/").filter(Boolean);
    const i=parts.findIndex(x=>x==="embed"||x==="shorts");
    if(i!==-1&&parts[i+1])return parts[i+1];
  }catch(e){}
  const m=value.match(/[A-Za-z0-9_-]{11}/);
  return m?m[0]:null;
}

function thumbnail(id){
  return "https://img.youtube.com/vi/"+id+"/hqdefault.jpg";
}

function setPlayIcon(){
  $("playIcon").innerHTML='<path d="M12 7v26l21-13z"/>';
}
function setPauseIcon(){
  $("playIcon").innerHTML='<path d="M10 7h7v26h-7zM23 7h7v26h-7z"/>';
}

window.onYouTubeIframeAPIReady=function(){
  apiReady=true;
  maybeCreatePlayer();
};

function maybeCreatePlayer(){
  if(!apiReady || player || !playlist.length || currentIndex<0)return;

  const id=playlist[currentIndex].id;
  player=new YT.Player("yt",{
    videoId:id,
    width:"100%",
    height:"100%",
    playerVars:{
      playsinline:1,
      controls:1,
      rel:0,
      origin:window.location.origin
    },
    events:{
      onReady:function(){
        playerReady=true;
        if(pendingVideo){
          const id=pendingVideo;
          pendingVideo=null;
          player.cueVideoById(id);
          if(pendingAutoplay){
            pendingAutoplay=false;
            setTimeout(()=>player.playVideo(),150);
          }
        }
      },
      onStateChange:function(e){
        if(e.data===YT.PlayerState.PLAYING){
          playing=true;
          $("cover").classList.add("playing");
          setPauseIcon();
        }else if(e.data===YT.PlayerState.PAUSED){
          playing=false;
          setPlayIcon();
        }else if(e.data===YT.PlayerState.ENDED){
          playing=false;
          setPlayIcon();
          nextTrack();
        }
      }
    }
  });
}

function loadTrack(index,autoplay){
  if(index<0||index>=playlist.length)return;

  currentIndex=index;
  playing=false;
  setPlayIcon();

  const id=playlist[index].id;
  $("thumb").src=thumbnail(id);
  $("cover").classList.remove("playing");
  renderList();

  if(!player){
    pendingVideo=id;
    pendingAutoplay=!!autoplay;
    maybeCreatePlayer();
    return;
  }

  if(!playerReady){
    pendingVideo=id;
    pendingAutoplay=!!autoplay;
    return;
  }

  player.loadVideoById(id);
  if(autoplay){
    setTimeout(()=>player && player.playVideo(),150);
  }
}

function play(){
  if(!playlist.length)return;

  if(currentIndex<0){
    loadTrack(0,true);
    return;
  }

  if(!player){
    pendingVideo=playlist[currentIndex].id;
    pendingAutoplay=true;
    maybeCreatePlayer();
    return;
  }

  if(!playerReady){
    pendingVideo=playlist[currentIndex].id;
    pendingAutoplay=true;
    return;
  }

  $("cover").classList.add("playing");
  player.playVideo();
}

function pause(){
  if(player && playerReady)player.pauseVideo();
}

function toggle(){
  if(!playlist.length)return;
  if(playing)pause();
  else play();
}

function previousTrack(){
  if(!playlist.length)return;
  const index=currentIndex<=0?playlist.length-1:currentIndex-1;
  loadTrack(index,true);
}

function nextTrack(){
  if(!playlist.length)return;
  const index=currentIndex>=playlist.length-1?0:currentIndex+1;
  loadTrack(index,true);
}

function addTracks(){
  const raw=$("url").value.trim();
  if(!raw)return;

  const candidates=raw.split(/\s+/).filter(Boolean);
  const ids=[];
  candidates.forEach(v=>{
    const id=extractId(v);
    if(id&&!ids.includes(id))ids.push(id);
  });

  if(!ids.length)return;

  const room=20-playlist.length;
  ids.slice(0,room).forEach(id=>playlist.push({id}));

  $("url").value="";
  renderList();

  if(currentIndex===-1)loadTrack(0,false);
  else maybeCreatePlayer();
}

function removeTrack(index,event){
  event.stopPropagation();
  const wasCurrent=index===currentIndex;
  playlist.splice(index,1);

  if(!playlist.length){
    currentIndex=-1;
    playing=false;
    $("cover").classList.remove("playing");
    $("thumb").src="";
    setPlayIcon();
    renderList();
    return;
  }

  if(index<currentIndex)currentIndex--;

  if(wasCurrent)loadTrack(Math.min(index,playlist.length-1),false);
  else renderList();
}

function renderList(){
  $("count").textContent=playlist.length+" / 20";

  if(!playlist.length){
    $("list").innerHTML='<div class="empty">아직 추가된 음악이 없어요.</div>';
    return;
  }

  $("list").innerHTML=playlist.map((track,index)=>`
    <div class="item ${index===currentIndex?"active":""}" data-index="${index}">
      <span class="num">${String(index+1).padStart(2,"0")}</span>
      <img src="${thumbnail(track.id)}" alt="">
      <div class="item-info">
        <div class="item-title">Music ${String(index+1).padStart(2,"0")}</div>
        <div class="item-sub">YouTube</div>
      </div>
      <button type="button" class="delete" data-delete="${index}">×</button>
    </div>
  `).join("");

  document.querySelectorAll(".item").forEach(item=>{
    item.addEventListener("click",()=>loadTrack(Number(item.dataset.index),true));
  });

  document.querySelectorAll(".delete").forEach(btn=>{
    btn.addEventListener("click",e=>removeTrack(Number(btn.dataset.delete),e));
  });
}

$("coverPlay").addEventListener("click",play);
$("toggle").addEventListener("click",toggle);
$("back").addEventListener("click",previousTrack);
$("forward").addEventListener("click",nextTrack);

$("showPlaylist").addEventListener("click",()=>{
  $("playlist").classList.toggle("open");
  if($("playlist").classList.contains("open"))
    setTimeout(()=>$("url").focus(),50);
});

$("add").addEventListener("click",addTracks);
$("url").addEventListener("keydown",e=>{
  if(e.key==="Enter"&&!e.shiftKey){
    e.preventDefault();
    addTracks();
  }
});

renderList();
setPlayIcon();
</script>
</body>
</html>
