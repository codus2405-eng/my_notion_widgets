<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>이번 주 기분 & 오늘의 운세</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;min-height:100%;background:transparent}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Malgun Gothic","Noto Sans KR",sans-serif;
  color:#52634d;
  padding:12px;
}
.widget{
  container-type:inline-size;
  position:relative;
  width:100%;
  max-width:none;
  margin:0;
  background:#fffefb;
  border:0;
  border-radius:4px 7px 5px 6px;
  overflow:hidden;
  box-shadow:
    1px 2px 0 rgba(127,168,120,.10),
    0 4px 14px rgba(73,88,68,.06);
}
.content{
    display:flex !important;
    flex-direction:column !important;
    width:100%;
    gap:0;
  }
.section{display:block;width:100%;padding:14px 16px 16px}
.section + .section{
    border-left:0 !important;
    border-top:1px dashed #dfe7d9;
    padding-top:18px;
  }
  .section{
    width:100%;
  }
.mood-week{
  display:flex;
  align-items:center;
  justify-content:flex-end;
  gap:6px;
  margin-bottom:8px;
  font-size:clamp(9px,1.5vw,11px);
  color:#71836c;
}
.mood-week button{
  width:20px;
  height:20px;
  border:1px solid #dbe4d8;
  border-radius:50%;
  background:#fff;
  color:#6f8468;
  cursor:pointer;
  line-height:16px;
  font-size:13px;
}
.mood-week button:active{background:#eef4eb}
.section-title{
  font-size:clamp(11px,1.8vw,13px);
  font-weight:700;
  color:#60745a;
  margin-bottom:10px;
}
.days{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:6px;
}
.day{
  min-width:0;
  text-align:center;
}
.day-name{
  font-size:9px;
  color:#8a9a85;
  margin-bottom:5px;
  font-weight:600;
}
.mood-btn{
  width:100%;
  aspect-ratio:1;
  min-height:28px;
  border:1px solid #dbe5d7;
  border-radius:8px;
  background:#fff;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:clamp(14px,3vw,20px);
  transition:.15s;
}
.mood-btn:hover{background:#f5f8f3}
.mood-btn.selected{
  background:#edf5e9;
  border-color:#9fbd96;
  box-shadow:inset 0 0 0 1px #9fbd96;
}
.mood-label{
  margin-top:4px;
  font-size:8px;
  color:#7c8b77;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.fortune{
  position:relative;
  min-height:clamp(70px, 18vh, 120px);
  padding:4px 2px 2px 0;
  background:transparent;
  border:0;
}
.fortune::before{
  content:"";
  display:block;
  width:34px;
  height:2px;
  margin-bottom:10px;
  background:#9fbd96;
  border-radius:99px;
}
.fortune-main{
  font-size:clamp(13px,2.1vw,16px);
  font-weight:700;
  color:#5d7357;
  margin-bottom:7px;
}
.fortune-text{
  max-width:560px;
  font-size:clamp(10px,1.6vw,12px);
  line-height:1.7;
  color:#71806d;
  word-break:keep-all;
}
@media (max-width:520px){
  body{padding:8px}
  .section{padding:12px;width:100%}
}
.content{grid-template-columns:1fr}
  .section + .section{border-left:0;border-top:1px solid #e7ece4}
  .section{padding:12px}
  .mood-label{font-size:7px}
}
.mood-btn{border-radius:6px}
}
</style>
</head>
<body>
<div class="widget">
  <div class="content">
    <section class="section">
      <div class="mood-week">
        <button id="prev" aria-label="이전 주">‹</button>
        <span id="range"></span>
        <button id="next" aria-label="다음 주">›</button>
      </div>
      <div class="section-title">✅Mood Check</div>
      <div class="days" id="days"></div>
    </section>

    <section class="section">
      <div class="section-title">🔮Fortune of Today</div>
      <div class="fortune">
        <div class="fortune-main" id="fortuneMain"></div>
        <div class="fortune-text" id="fortuneText"></div>
      </div>
    </section>
  </div>
</div>

<script>
const moods=[
  ["😊","기쁨"],
  ["😢","슬픔"],
  ["😡","화남"],
  ["😤","짜증"],
  ["😮‍💨","지침"],
  ["😳","당황"],
  ["😞","우울"],
  ["😌","평온"],
  ["😐","그저그럼"],
  ["🤯","복잡함"]
];

const fortunes=[
 ["작은 행운","오늘은 사소한 일이 기분 좋은 방향으로 흘러가요.","초록색"],
 ["순조로운 하루","미뤄두었던 일을 하나씩 시작하면 생각보다 쉽게 풀려요.","따뜻한 차"],
 ["마음의 여유","급하게 결론 내리지 않아도 괜찮아요. 천천히 해도 충분해요.","산책"],
 ["좋은 소식","기다리던 연락이나 반가운 이야기가 찾아올 수 있는 날이에요.","노란색"],
 ["집중의 날","오늘은 하나에 집중할수록 만족스러운 결과를 얻을 수 있어요.","음악"],
 ["새로운 발견","평소 지나치던 것에서 새로운 재미를 발견할 수 있어요.","작은 꽃"],
 ["편안한 하루","오늘은 무리하지 말고 내가 편안한 속도를 지켜보세요.","포근한 담요"],
 ["용기의 날","작게라도 먼저 움직여보세요. 시작이 생각보다 가벼울 거예요.","초록 잎"],
 ["기분 전환","잠깐의 휴식이 오히려 좋은 아이디어를 가져다줘요.","창문 열기"],
 ["따뜻한 하루","주변 사람에게 건넨 작은 친절이 좋은 기분으로 돌아와요.","미소"],
 ["차곡차곡","하나씩 해낸 일이 모여 생각보다 큰 성취가 되는 날이에요.","체크리스트"],
 ["느긋한 행운","조금 느려도 괜찮아요. 오늘은 여유가 행운을 부르는 날이에요.","흰색"]
];

const key='mood_widget_data_v3';
let data=JSON.parse(localStorage.getItem(key)||'{}');
let offset=0;

function dateKey(d){
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,'0')+"-"+String(d.getDate()).padStart(2,'0');
}
function startOfWeek(d){
  const x=new Date(d); const day=x.getDay();
  const diff=day===0?-6:1-day;
  x.setDate(x.getDate()+diff); x.setHours(0,0,0,0); return x;
}
function fmt(d){return String(d.getMonth()+1).padStart(2,'0')+"/"+String(d.getDate()).padStart(2,'0')}

function render(){
  const base=startOfWeek(new Date());
  base.setDate(base.getDate()+offset*7);
  const end=new Date(base); end.setDate(end.getDate()+6);
  document.getElementById('range').textContent=fmt(base)+" ~ "+fmt(end);

  const days=document.getElementById('days'); days.innerHTML='';
  const names=['M','T','W','T','F','S','S'];
  for(let i=0;i<7;i++){
    const d=new Date(base); d.setDate(base.getDate()+i);
    const k=dateKey(d);
    const wrap=document.createElement('div'); wrap.className='day';
    const chosen=data[k];
    wrap.innerHTML=`<div class="day-name">${names[i]}</div>`;
    const btn=document.createElement('button');
    btn.className='mood-btn'+(chosen?' selected':'');
    btn.title='기분 선택';
    btn.textContent=chosen?chosen[0]:'＋';
    btn.onclick=()=>chooseMood(k,btn);
    wrap.appendChild(btn);
    const lab=document.createElement('div'); lab.className='mood-label'; lab.textContent=chosen?chosen[1]:'';
    wrap.appendChild(lab);
    days.appendChild(wrap);
  }

  const now=new Date();
  const f=fortunes[(now.getFullYear()*37+now.getMonth()*13+now.getDate())%fortunes.length];
  document.getElementById('fortuneMain').textContent=f[0];
  document.getElementById('fortuneText').textContent=f[1];
}
function chooseMood(k,btn){
  const current=data[k];
  let idx=0;

  if(current){
    const currentIndex=moods.findIndex(m=>m[1]===current[1]);
    idx=currentIndex+1;

    // 마지막 감정 다음에는 다시 미선택 상태로 돌아갑니다.
    if(idx>=moods.length){
      delete data[k];
      localStorage.setItem(key,JSON.stringify(data));
      render();
      return;
    }
  }

  data[k]=moods[idx];
  localStorage.setItem(key,JSON.stringify(data));
  render();
}
document.getElementById('prev').onclick=()=>{offset--;render()};
document.getElementById('next').onclick=()=>{offset++;render()};
render();
</script>
</body>
</html>
<style>
@container (max-width:380px){
  .section{padding:11px 12px}
  .days{gap:3px}
  .mood-label{font-size:7px}
  .section-title{font-size:11px}
}
@container (min-width:600px){
  .section{padding:16px 20px}
  .days{gap:8px}
}
</style>
