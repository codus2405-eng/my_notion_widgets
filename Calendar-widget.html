<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>포토 캘린더</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Malgun Gothic", sans-serif;
    background: transparent;
    display: flex;
    justify-content: center;
    padding: 20px 12px;
  }
  .card {
    width: 100%;
    max-width: 320px;
    background: #FFFFFF;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 4px 24px rgba(0,0,0,0.08);
  }

  .hero {
    width: 100%;
    height: 190px;
    background: #EAF1EF;
    position: relative;
    cursor: pointer;
    overflow: hidden;
  }
  .hero img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .hero-placeholder {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    color: #9BAFA9;
  }
  .hero-placeholder svg { width: 30px; height: 30px; }
  .hero-placeholder span { font-size: 12px; }
  #photoInput { display: none; }

  .dotted-divider {
    display: flex;
    justify-content: space-between;
    padding: 6px 10px 0;
  }
  .dotted-divider span {
    width: 3px; height: 3px;
    border-radius: 50%;
    background: #D8DDD9;
  }

  .header {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    padding: 18px 0 6px;
  }
  .nav-btn {
    width: 22px; height: 22px;
    border: none;
    background: transparent;
    color: #C7CCC9;
    font-size: 14px;
    cursor: pointer;
  }
  .nav-btn:active { color: #8A9C95; }
  .month-label { font-size: 16px; font-weight: 700; color: #4A5D3A; letter-spacing: 0.3px; display: flex; align-items: center; gap: 6px; }
  .month-label .sep { font-size: 13px; }

  .weekdays, .days {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    text-align: center;
  }
  .weekdays {
    padding: 10px 14px 4px;
  }
  .weekdays div { font-size: 10px; color: #6FA35E; font-weight: 600; }

  .days { padding: 0 14px 20px; }
  .days div {
    height: 34px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    color: #3C3C38;
  }
  .days .muted { color: #D9D9D5; }
  .days .today span {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background: #6FA35E;
    color: #FFFFFF;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
  }
</style>
</head>
<body>

<div class="card">
  <div class="hero" id="heroBtn">
    <div class="hero-placeholder" id="heroPlaceholder">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="8.5" cy="10.5" r="1.5"/><path d="M21 15l-5-5-9 9"/></svg>
      <span>사진이나 움짤을 눌러서 추가하세요</span>
    </div>
    <img id="heroImg" style="display:none;" alt="배너 이미지">
    <input type="file" id="photoInput" accept="image/*">
  </div>

  <div class="dotted-divider" id="dots"></div>

  <div class="header">
    <button class="nav-btn" id="prevBtn">&#8249;</button>
    <div class="month-label" id="monthLabel"></div>
    <button class="nav-btn" id="nextBtn">&#8250;</button>
  </div>

  <div class="weekdays">
    <div>S</div><div>M</div><div>T</div><div>W</div><div>T</div><div>F</div><div>S</div>
  </div>
  <div class="days" id="daysGrid"></div>
</div>

<script>
  const STORAGE_KEY = 'photo_calendar_hero';
  const monthNames = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  const today = new Date();
  let viewYear = today.getFullYear();
  let viewMonth = today.getMonth();

  // 점선 구분선 생성
  const dots = document.getElementById('dots');
  for (let i = 0; i < 24; i++) {
    const s = document.createElement('span');
    dots.appendChild(s);
  }

  // 배너 이미지 업로드
  const savedPhoto = localStorage.getItem(STORAGE_KEY);
  if (savedPhoto) {
    document.getElementById('heroImg').src = savedPhoto;
    document.getElementById('heroImg').style.display = 'block';
    document.getElementById('heroPlaceholder').style.display = 'none';
  }
  document.getElementById('heroBtn').addEventListener('click', () => {
    document.getElementById('photoInput').click();
  });
  document.getElementById('photoInput').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      localStorage.setItem(STORAGE_KEY, ev.target.result);
      document.getElementById('heroImg').src = ev.target.result;
      document.getElementById('heroImg').style.display = 'block';
      document.getElementById('heroPlaceholder').style.display = 'none';
    };
    reader.readAsDataURL(file);
  });

  function render() {
    document.getElementById('monthLabel').innerHTML = (viewMonth + 1) + '월 <span class="sep">🌰</span> ' + viewYear;

    const grid = document.getElementById('daysGrid');
    grid.innerHTML = '';

    const firstDay = new Date(viewYear, viewMonth, 1).getDay();
    const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
    const daysInPrevMonth = new Date(viewYear, viewMonth, 0).getDate();

    for (let i = firstDay - 1; i >= 0; i--) {
      const cell = document.createElement('div');
      cell.className = 'muted';
      cell.textContent = daysInPrevMonth - i;
      grid.appendChild(cell);
    }

    for (let d = 1; d <= daysInMonth; d++) {
      const cell = document.createElement('div');
      const isToday = d === today.getDate() && viewMonth === today.getMonth() && viewYear === today.getFullYear();
      if (isToday) {
        cell.classList.add('today');
        cell.innerHTML = '<span>' + d + '</span>';
      } else {
        cell.textContent = d;
      }
      cell.style.cursor = 'default';
      grid.appendChild(cell);
    }

    const totalCells = firstDay + daysInMonth;
    const remaining = (7 - (totalCells % 7)) % 7;
    for (let d = 1; d <= remaining; d++) {
      const cell = document.createElement('div');
      cell.className = 'muted';
      cell.textContent = d;
      grid.appendChild(cell);
    }
  }

  document.getElementById('prevBtn').addEventListener('click', () => {
    viewMonth--;
    if (viewMonth < 0) { viewMonth = 11; viewYear--; }
    render();
  });
  document.getElementById('nextBtn').addEventListener('click', () => {
    viewMonth++;
    if (viewMonth > 11) { viewMonth = 0; viewYear++; }
    render();
  });

  render();
</script>
</body>
</html>
