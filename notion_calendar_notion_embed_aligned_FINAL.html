<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Little Forest Calendar</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

html,body{
  width:100%;
  min-width:0;
  background:transparent;
}

body{
  font-family:-apple-system,BlinkMacSystemFont,"Malgun Gothic","Segoe UI",sans-serif;
  display:block;
  padding:0;
  color:#4a4a43;
}

.calendar-card{
  width:100%;
  max-width:420px;
  margin:0 auto;
  background:#fff;
  border-radius:16px;
  overflow:hidden;
  box-shadow:0 4px 24px rgba(0,0,0,.07);
}

/* 사진 */
.photo{
  width:100%;
  aspect-ratio:320/190;
  background:#eaf1ef;
  position:relative;
  overflow:hidden;
  cursor:pointer;
}

.photo img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.photo-empty{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  gap:7px;
  color:#9bafa9;
  font-size:clamp(9px,3vw,12px);
}

.photo-empty svg{
  width:clamp(22px,8vw,30px);
  height:clamp(22px,8vw,30px);
}

#photoInput{display:none}

/* 점선 */
.divider{
  height:10px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 3%;
}

.divider i{
  width:3px;
  height:3px;
  border-radius:50%;
  background:#d8ddd9;
}

/* 월 헤더 */
.month-header{
  display:grid;
  grid-template-columns:32px 1fr 32px;
  align-items:center;
  padding:10px 7% 4px;
}

.month-title{
  text-align:center;
  font-size:clamp(13px,4.5vw,16px);
  font-weight:700;
  color:#4a5d3a;
  white-space:nowrap;
}

.nav{
  width:28px;
  height:28px;
  border:0;
  background:transparent;
  color:#c7ccc9;
  font-size:19px;
  line-height:28px;
  cursor:pointer;
}

.nav:active{color:#6fa35e}

/* 달력 */
.calendar{
  width:100%;
  padding:0 5% 13px;
}

.weekdays,
.days{
  display:grid;
  grid-template-columns:repeat(7,minmax(0,1fr));
}

.weekdays{
  padding:5px 0 3px;
}

.weekdays div{
  text-align:center;
  font-size:clamp(8px,3vw,10px);
  font-weight:600;
  color:#6fa35e;
  line-height:1.5;
}

.days{
  grid-auto-rows:clamp(31px,9.8vw,38px);
}

.day{
  position:relative;
  min-width:0;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:clamp(10px,3.8vw,13px);
  color:#3c3c38;
}

.day.muted{color:#d9d9d5}

.day-number{
  width:clamp(22px,7.8vw,26px);
  height:clamp(22px,7.8vw,26px);
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:50%;
  position:relative;
  z-index:1;
}

.day.today .day-number{
  background:#6fa35e;
  color:#fff;
  font-weight:700;
}

/* 일정 표시
   날짜 숫자 바로 아래의 '행 중간 여백'에 정확히 중앙 배치 */
.event-dot{
  position:absolute;
  left:50%;
  top:calc(50% + clamp(10px,3.2vw,13px));
  transform:translate(-50%,-50%);
  width:4px;
  height:4px;
  border-radius:50%;
  background:#7fa878;
  z-index:3;
  pointer-events:none;
}

.day.today .event-dot{
  background:#fff;
}

/* 공휴일 텍스트 */
.holiday-name{
  position:absolute;
  left:50%;
  bottom:1px;
  transform:translateX(-50%);
  font-size:7px;
  color:#c98576;
  white-space:nowrap;
  pointer-events:none;
}

/* 일정이 여러 개면 작은 점 하나로 표시 */
.event-count{
  position:absolute;
  left:50%;
  top:calc(50% + clamp(10px,3.2vw,13px));
  transform:translate(-50%,-50%);
  min-width:4px;
  height:4px;
  border-radius:50%;
  background:#7fa878;
  pointer-events:none;
}

.day.today .event-count{background:#fff}

/* 일정 hover 미니창 */
.event-popover{
  position:fixed;
  z-index:9999;
  display:none;
  width:180px;
  max-width:calc(100vw - 24px);
  padding:10px 11px;
  background:#fff;
  border:1px solid #e3e8e2;
  border-radius:10px;
  box-shadow:0 6px 22px rgba(0,0,0,.12);
  font-size:11px;
  line-height:1.55;
}

.event-popover.show{display:block}

.event-popover strong{
  display:block;
  margin-bottom:4px;
  color:#4a5d3a;
  font-size:11px;
}

.event-popover span{
  display:block;
  color:#6f716c;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

/* 일정 등록 모달 */
.modal-backdrop{
  position:fixed;
  inset:0;
  z-index:10000;
  display:none;
  align-items:center;
  justify-content:center;
  padding:16px;
  background:rgba(50,60,52,.18);
}

.modal-backdrop.show{display:flex}

.modal{
  width:min(320px,calc(100vw - 32px));
  max-height:calc(100vh - 32px);
  overflow:auto;
  background:#fff;
  border:1px solid #e1e7df;
  border-radius:16px;
  box-shadow:0 12px 36px rgba(0,0,0,.14);
  padding:17px;
}

.modal-title{
  text-align:center;
  color:#4a5d3a;
  font-weight:700;
  font-size:15px;
  margin-bottom:14px;
}

.form-label{
  display:block;
  margin:10px 0 6px;
  font-size:11px;
  color:#73766f;
  font-weight:600;
}

.date-row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

input[type="date"],
input[type="text"]{
  width:100%;
  min-width:0;
  height:36px;
  border:1px solid #dfe5dd;
  border-radius:8px;
  padding:0 9px;
  font:inherit;
  font-size:12px;
  color:#55584f;
  background:#fbfcfa;
  outline:none;
}

input:focus{
  border-color:#9fba99;
  background:#fff;
}

.modal-actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:15px;
}

.modal-actions button{
  height:35px;
  border:0;
  border-radius:8px;
  font-size:12px;
  cursor:pointer;
}

.cancel{
  background:#f1f3f0;
  color:#777b73;
}

.save{
  background:#6fa35e;
  color:#fff;
}

.saved-list{
  margin-top:15px;
  border-top:1px solid #edf0ec;
  padding-top:11px;
}

.saved-list-title{
  font-size:10px;
  color:#8a8d86;
  margin-bottom:6px;
}

.saved-item{
  display:flex;
  align-items:center;
  gap:6px;
  padding:5px 0;
  font-size:11px;
  color:#5d6059;
}

.saved-item .dot{
  width:4px;
  height:4px;
  border-radius:50%;
  background:#7fa878;
  flex:none;
}

.saved-item button{
  margin-left:auto;
  border:0;
  background:transparent;
  color:#b3b7b0;
  cursor:pointer;
  font-size:12px;
}

/* 아주 좁은 노션 열에서도 깨지지 않도록 */
@media(max-width:280px){
  .calendar-card{border-radius:10px}
  .month-header{grid-template-columns:25px 1fr 25px;padding-left:4%;padding-right:4%}
  .calendar{padding-left:3%;padding-right:3%}
  .days{grid-auto-rows:29px}
  .event-dot,.event-count{top:calc(50% + 10px)}
}
</style>

<style id="event-dot-center-final">
/* 일정 점은 '일자 칸'의 정확한 가로 중앙에 배치 */
.days .day .event-dot,
.days .day .event-count {
  left: 50% !important;
  transform: translateX(-50%) !important;
  margin-left: 0 !important;
  right: auto !important;
}

/* 날짜 숫자 아래에 가깝게, 중앙선은 그대로 유지 */
.days .day .event-dot,
.days .day .event-count {
  top: calc(50% + clamp(8px, 2.5vw, 10px)) !important;
  bottom: auto !important;
}

/* 오늘 날짜도 동일하게 중앙 */
.days .day.today .event-dot,
.days .day.today .event-count {
  left: 50% !important;
  transform: translateX(-50%) !important;
  top: calc(50% + clamp(8px, 2.5vw, 10px)) !important;
}
</style>


<style id="event-dot-tiny-gap-final">
/* 날짜 숫자와 일정 점 사이에 아주 작은 여백 */
.days .day .event-dot,
.days .day .event-count {
  top: calc(50% + 7px) !important;
  left: 50% !important;
  transform: translateX(-50%) !important;
  bottom: auto !important;
}

.days .day.today .event-dot,
.days .day.today .event-count {
  top: calc(50% + 7px) !important;
  left: 50% !important;
  transform: translateX(-50%) !important;
}
</style>



<style id="event-dot-exact-center">
/* 일정 점: 각 날짜 칸의 정확한 수평 중앙 */
.days .day {
  position: relative !important;
}

.days .day .event-dot,
.days .day .event-count {
  position: absolute !important;
  left: 50% !important;
  right: auto !important;
  margin-left: 0 !important;
  margin-right: 0 !important;
  transform: translateX(-50%) !important;
  top: calc(50% + 7px) !important;
  bottom: auto !important;
  width: 4px !important;
  min-width: 4px !important;
  height: 4px !important;
  padding: 0 !important;
  border-radius: 50% !important;
}

/* 오늘 날짜도 같은 중앙선에 배치 */
.days .day.today .event-dot,
.days .day.today .event-count {
  left: 50% !important;
  transform: translateX(-50%) !important;
  top: calc(50% + 7px) !important;
  background: #FFFFFF !important;
  z-index: 10 !important;
}
</style>


<style id="event-text-bold">
/* 일정 기록으로 등록된 일정은 굵게 표시 */
.event-item,
.event-title,
.event-name,
.calendar-event,
.schedule-event,
.schedule-title,
.event-label {
  font-weight: 700 !important;
}
</style>


<style id="soot-sprite-icon">
/* 월/년도 사이의 검정 먼지뭉치 아이콘 */
.month-label .soot-icon {
  position: relative;
  display: inline-block;
  width: 17px;
  height: 17px;
  flex: 0 0 17px;
  font-size: 0;
  vertical-align: middle;
  border-radius: 50%;
  background: #242822;
  box-shadow:
    -5px 2px 0 -2px #242822,
    5px -2px 0 -2px #242822,
    1px 5px 0 -3px #242822;
}

/* 작은 털/뭉침 포인트 */
.month-label .soot-icon::before,
.month-label .soot-icon::after {
  content: "";
  position: absolute;
  background: #242822;
  border-radius: 50%;
}
.month-label .soot-icon::before {
  width: 5px;
  height: 5px;
  left: 1px;
  top: -2px;
}
.month-label .soot-icon::after {
  width: 4px;
  height: 4px;
  right: 0;
  bottom: 0;
}

/* 눈 */
.month-label .soot-icon i,
.month-label .soot-icon b {
  position: absolute;
  display: block;
  width: 3px;
  height: 3px;
  border-radius: 50%;
  background: #fff;
  top: 6px;
  z-index: 2;
}
.month-label .soot-icon i { left: 4px; }
.month-label .soot-icon b { right: 4px; }

/* 눈동자 */
.month-label .soot-icon i::after,
.month-label .soot-icon b::after {
  content: "";
  position: absolute;
  width: 1.5px;
  height: 1.5px;
  border-radius: 50%;
  background: #242822;
  left: 1px;
  top: 1px;
}

/* 장식용 작은 돌기 */
.month-label .soot-icon em,
.month-label .soot-icon strong {
  position: absolute;
  display: block;
  width: 3px;
  height: 3px;
  border-radius: 50%;
  background: #242822;
}
.month-label .soot-icon em { left: -2px; top: 7px; }
.month-label .soot-icon strong { right: -2px; top: 4px; }
</style>


<style id="event-holiday-final">
/* 공휴일: 달력에서는 레드 컬러 동그라미만 */
.days .day .holiday-dot{
  position:absolute !important;
  left:calc(50% + 7px) !important;
  top:calc(50% + 7px) !important;
  width:4px !important;
  height:4px !important;
  border-radius:50% !important;
  background:#C9786F !important;
  transform:translate(-50%,-50%) !important;
  z-index:4 !important;
  pointer-events:none !important;
}

/* 일정 점과 공휴일 점이 같은 날이면 나란히 표시 */
.days .day .event-dot{
  left:calc(50% - 7px) !important;
}

/* 오늘 날짜의 일정 점은 흰색 */
.days .day.today .event-dot{
  background:#fff !important;
}

/* 선택 날짜의 공휴일 */
.selected-holiday{
  margin:7px 0 2px;
  padding:7px 8px;
  border-radius:7px;
  background:#fff5f3;
  color:#c9786f;
  font-size:10px;
  font-weight:700;
}

/* hover 일정창 */
.event-popover{
  pointer-events:none !important;
  min-width:150px;
}

.event-popover strong{
  font-weight:700 !important;
}

.event-popover span{
  font-weight:600 !important;
}
</style>


<style id="calendar-four-fixes-final">
/* =========================================
   1. 날짜에 마우스를 올리면 해당 날짜 일정만 팝업
   ========================================= */
.days .day {
  position: relative !important;
}

/* 기존 팝업이 날짜 셀 안에서 잘리지 않도록 */
.event-popover {
  pointer-events: none !important;
  z-index: 999 !important;
}

/* =========================================
   2. 대한민국 공휴일 = 레드 컬러 동그라미
   ========================================= */
.days .day .holiday-dot {
  position: absolute !important;
  left: 50% !important;
  top: calc(50% + 11px) !important;
  width: 4px !important;
  height: 4px !important;
  padding: 0 !important;
  margin: 0 !important;
  border-radius: 50% !important;
  background: #C9786F !important;
  transform: translate(-50%, -50%) !important;
  z-index: 5 !important;
}

/* =========================================
   3. 일정 뒤 날짜 표시 제거
   ========================================= */
.saved-item > span:last-of-type {
  font-weight: 700 !important;
}

/* =========================================
   4. 일정 표시 점
   - 날짜 숫자와 아주 살짝 떨어짐
   - 날짜 칸의 정확한 중앙
   ========================================= */
.days .day .event-dot,
.days .day .event-count {
  position: absolute !important;
  left: 50% !important;
  right: auto !important;
  top: calc(50% + 10px) !important;
  bottom: auto !important;
  transform: translate(-50%, -50%) !important;
  margin: 0 !important;
  padding: 0 !important;
  width: 4px !important;
  min-width: 4px !important;
  height: 4px !important;
  min-height: 4px !important;
  border-radius: 50% !important;
  z-index: 6 !important;
}

/* 오늘 날짜: 일정 점은 흰색 */
.days .day.today .event-dot,
.days .day.today .event-count {
  left: 50% !important;
  top: calc(50% + 10px) !important;
  transform: translate(-50%, -50%) !important;
  background: #FFFFFF !important;
  z-index: 10 !important;
}

/* 일정과 공휴일이 동시에 있는 날:
   두 점을 겹치지 않고 좌우로 살짝 배치 */
.days .day:has(.event-dot):has(.holiday-dot) .event-dot,
.days .day:has(.event-count):has(.holiday-dot) .event-count {
  left: calc(50% - 4px) !important;
}

.days .day:has(.event-dot):has(.holiday-dot) .holiday-dot {
  left: calc(50% + 4px) !important;
}

/* 오늘 + 공휴일 + 일정 */
.days .day.today:has(.holiday-dot):has(.event-dot) .event-dot,
.days .day.today:has(.holiday-dot):has(.event-count) .event-count {
  left: calc(50% - 4px) !important;
}

.days .day.today:has(.holiday-dot) .holiday-dot {
  left: calc(50% + 4px) !important;
}
</style>

<body>
<div class="calendar-card">

  <div class="photo" id="photoArea" title="사진을 클릭해서 변경">
    <div class="photo-empty" id="photoEmpty">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <rect x="3" y="5" width="18" height="14" rx="2"/>
        <circle cx="8.5" cy="10.5" r="1.5"/>
        <path d="M21 15l-5-5-9 9"/>
      </svg>
      <span>사진이나 GIF를 눌러서 추가하세요</span>
    </div>
    <img id="photoImage" alt="캘린더 이미지" style="display:none">
    <input id="photoInput" type="file" accept="image/*,.gif">
  </div>

  <div class="divider" id="divider"></div>

  <div class="month-header">
    <button class="nav" id="prev" aria-label="이전 달">‹</button>
    <div class="month-title" id="monthTitle"></div>
    <button class="nav" id="next" aria-label="다음 달">›</button>
  </div>

  <div class="calendar">
    <div class="weekdays">
      <div>S</div><div>M</div><div>T</div><div>W</div><div>T</div><div>F</div><div>S</div>
    </div>
    <div class="days" id="days"></div>
  </div>
</div>

<div class="event-popover" id="popover"></div>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal">
    <div class="modal-title">일정 기록</div>

    <label class="form-label">시작 ~ 종료</label>
    <div class="date-row">
      <input id="startDate" type="date">
      <input id="endDate" type="date">
    </div>

    <label class="form-label">일정</label>
    <input id="eventText" type="text" maxlength="80" placeholder="일정을 입력하세요">

    <div class="modal-actions">
      <button class="cancel" id="cancelBtn">취소</button>
      <button class="save" id="saveBtn">저장</button>
    </div>

    <div class="saved-list">
      <div class="saved-list-title" id="selectedDateTitle">선택한 날짜의 일정</div>
      <div id="selectedHoliday" class="selected-holiday" style="display:none"></div>
      <div id="savedList"></div>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";

  const PHOTO_KEY = "little_forest_calendar_photo_v3";
  const EVENT_KEY = "little_forest_calendar_events_v3";

  const today = new Date();
  let year = today.getFullYear();
  let month = today.getMonth();

  let events = loadEvents();
  let selectedDate = null;

  const $ = id => document.getElementById(id);

  /* 점선 */
  for(let i=0;i<28;i++){
    const dot=document.createElement("i");
    $("divider").appendChild(dot);
  }

  /* 사진 */
  try{
    const saved=localStorage.getItem(PHOTO_KEY);
    if(saved){
      $("photoImage").src=saved;
      $("photoImage").style.display="block";
      $("photoEmpty").style.display="none";
    }
  }catch(e){}

  $("photoArea").addEventListener("click",()=> $("photoInput").click());

  $("photoInput").addEventListener("change",e=>{
    const file=e.target.files && e.target.files[0];
    if(!file)return;

    const isImage=file.type && file.type.startsWith("image/");
    const isGif=/\\.gif$/i.test(file.name);

    if(!isImage && !isGif){
      alert("사진 또는 GIF 파일만 첨부할 수 있어요.");
      e.target.value="";
      return;
    }

    const reader=new FileReader();

    reader.onload=ev=>{
      const dataUrl=ev.target.result;

      // GIF는 원본 GIF data URL을 그대로 img src에 넣어
      // 프레임 애니메이션이 유지되도록 합니다.
      try{
        localStorage.setItem(PHOTO_KEY,dataUrl);
      }catch(err){
        // 용량이 큰 GIF는 localStorage 제한을 넘을 수 있으므로
        // 현재 화면에는 정상 표시합니다.
        console.warn("저장 용량 제한으로 GIF가 새로고침 후 유지되지 않을 수 있습니다.",err);
      }

      $("photoImage").src=dataUrl;
      $("photoImage").style.display="block";
      $("photoEmpty").style.display="none";
    };

    reader.readAsDataURL(file);
  });

  function dateKey(y,m,d){
    return y+"-"+String(m+1).padStart(2,"0")+"-"+String(d).padStart(2,"0");
  }

  function loadEvents(){
    try{
      const data=JSON.parse(localStorage.getItem(EVENT_KEY)||"[]");
      return Array.isArray(data)?data:[];
    }catch(e){return []}
  }

  function saveEvents(){
    try{localStorage.setItem(EVENT_KEY,JSON.stringify(events))}catch(e){}
  }

  function formatDate(key){
    const p=key.split("-").map(Number);
    return p[0]+"."+String(p[1]).padStart(2,"0")+"."+String(p[2]).padStart(2,"0");
  }

  function getEventsForDate(key){
    return events.filter(ev=>ev.start<=key && ev.end>=key);
  }

  /* 대한민국 주요 공휴일
     매년 고정되는 공휴일을 자동 표시하고, 설/추석/어린이날 등은
     2025~2030 범위에서 주요 날짜를 포함 */
  

  function render(){
    $("monthTitle").textContent=(month+1)+"월  🍀  "+year;

    const grid=$("days");
    grid.innerHTML="";

    const first=new Date(year,month,1).getDay();
    const total=new Date(year,month+1,0).getDate();
    const prevTotal=new Date(year,month,0).getDate();

    for(let i=first-1;i>=0;i--){
      const cell=document.createElement("div");
      cell.className="day muted";
      cell.textContent=prevTotal-i;
      grid.appendChild(cell);
    }

    for(let d=1;d<=total;d++){
      const cell=document.createElement("div");
      cell.className="day";

      const key=dateKey(year,month,d);
      const number=document.createElement("span");
      number.className="day-number";
      number.textContent=d;
      cell.appendChild(number);

      if(
        d===today.getDate() &&
        month===today.getMonth() &&
        year===today.getFullYear()
      ){
        cell.classList.add("today");
      }

      const dayEvents=getEventsForDate(key);
      const holiday=(window.koreaPublicHolidays || {})[key];

      if(dayEvents.length){
        const marker=document.createElement("span");
        marker.className="event-dot";
        cell.appendChild(marker);
      }

      if(holiday){
        const h=document.createElement("span");
        h.className="holiday-dot";
        h.title=holiday;
        h.dataset.holiday=holiday;
        cell.appendChild(h);
      }

      // 일반 일정과 법정공휴일은 동일한 #popover를 사용합니다.
      if(dayEvents.length || holiday){
        cell.addEventListener("mouseenter",e=>showPopover(e,key,dayEvents,holiday));
        cell.addEventListener("mousemove",movePopover);
        cell.addEventListener("mouseleave",hidePopover);
      }

      cell.addEventListener("click",()=>openModal(key));
      grid.appendChild(cell);
    }

    const used=first+total;
    const remaining=(7-(used%7))%7;

    for(let d=1;d<=remaining;d++){
      const cell=document.createElement("div");
      cell.className="day muted";
      cell.textContent=d;
      grid.appendChild(cell);
    }
  }

  function showPopover(e,key,list,holiday){
    const p=$("popover");

    let content="<strong>"+formatDate(key)+"</strong>";

    if(list && list.length){
      content += list.map(x=>
        "<span>• "+escapeHtml(x.text)+"</span>"
      ).join("");
    }

    // 공휴일도 일반 일정과 동일한 팝업창에 표시
    if(holiday){
      content += "<span class=\"holiday-popover-item\">• "+
        escapeHtml(holiday)+
        "</span>";
    }

    p.innerHTML=content;
    p.classList.add("show");
    movePopover(e);
  }

  function movePopover(e){
    const p=$("popover");
    if(!p.classList.contains("show"))return;
    const margin=10;
    let x=e.clientX+12;
    let y=e.clientY+12;
    const rect=p.getBoundingClientRect();
    if(x+rect.width>window.innerWidth-margin)x=e.clientX-rect.width-12;
    if(y+rect.height>window.innerHeight-margin)y=e.clientY-rect.height-12;
    p.style.left=Math.max(margin,x)+"px";
    p.style.top=Math.max(margin,y)+"px";
  }

  function hidePopover(){
    $("popover").classList.remove("show");
  }

  function openModal(key){
    selectedDate=key;
    $("startDate").value=key;
    $("endDate").value=key;
    $("eventText").value="";
    renderSavedList();
    updateSelectedHoliday();
    $("modalBackdrop").classList.add("show");
    setTimeout(()=>$("eventText").focus(),50);
  }

  function closeModal(){
    $("modalBackdrop").classList.remove("show");
    selectedDate=null;
  }

  function renderSavedList(){
    const list=$("savedList");

    // 일정 기록창을 연 날짜에 해당하는 일정만 표시
    const target = selectedDate || $("startDate").value;
    const filtered = events
      .filter(ev => ev.start <= target && ev.end >= target)
      .sort((a,b) => a.start.localeCompare(b.start));

    if(!filtered.length){
      list.innerHTML='<div style="font-size:10px;color:#b4b8b1;padding:4px 0">선택한 날짜에 등록된 일정이 없어요.</div>';
      return;
    }

    list.innerHTML=filtered.map(ev=>
      '<div class="saved-item">'+
      '<span class="dot"></span>'+
      '<span><strong>'+escapeHtml(ev.text)+'</strong></span>'+
      '<button data-id="'+ev.id+'" aria-label="일정 삭제">×</button>'+
      '</div>'
    ).join("");

    list.querySelectorAll("button").forEach(btn=>{
      btn.addEventListener("click",()=>{
        events=events.filter(ev=>ev.id!==btn.dataset.id);
        saveEvents();
        renderSavedList();
        render();
      });
    });
  }

  $("saveBtn").addEventListener("click",()=>{
    const start=$("startDate").value;
    const end=$("endDate").value;
    const text=$("eventText").value.trim();

    if(!start||!end){
      alert("시작 날짜와 종료 날짜를 선택해주세요.");
      return;
    }

    if(start>end){
      alert("종료 날짜는 시작 날짜보다 빠를 수 없어요.");
      return;
    }

    if(!text){
      alert("일정을 입력해주세요.");
      $("eventText").focus();
      return;
    }

    events.push({
      id:String(Date.now())+"_"+Math.random().toString(36).slice(2),
      start,
      end,
      text
    });

    saveEvents();
    closeModal();
    render();
  });

  $("cancelBtn").addEventListener("click",closeModal);

  $("modalBackdrop").addEventListener("click",e=>{
    if(e.target===$("modalBackdrop"))closeModal();
  });

  $("startDate").addEventListener("change",()=>{
    if($("endDate").value<$("startDate").value){
      $("endDate").value=$("startDate").value;
    }
    selectedDate=$("startDate").value;
    renderSavedList();
    updateSelectedHoliday();
  });

  $("endDate").addEventListener("change",()=>{
    updateSelectedHoliday();
  });

  function updateSelectedHoliday(){
    const target=$("startDate").value;
    const holiday=holidays[target];
    const box=$("selectedHoliday");
    $("selectedDateTitle").textContent =
      target ? formatDate(target)+" 일정" : "선택한 날짜의 일정";

    if(holiday){
      box.style.display="block";
      box.textContent="● "+holiday;
    }else{
      box.style.display="none";
      box.textContent="";
    }
  }

  $("prev").addEventListener("click",()=>{
    month--;
    if(month<0){month=11;year--}
    render();
  });

  $("next").addEventListener("click",()=>{
    month++;
    if(month>11){month=0;year++}
    render();
  });

  function escapeHtml(str){
    return String(str)
      .replaceAll("&","&amp;")
      .replaceAll("<","&lt;")
      .replaceAll(">","&gt;")
      .replaceAll('"',"&quot;")
      .replaceAll("'","&#039;");
  }

  render();
})();
</script>

</body>
</html>
